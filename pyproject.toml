[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "vera-anchor-verifier"
version = "0.1.0"
description = "Independent, read-only verification of Vera Anchor evidence and supported HCS records"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [
    { name = "Vera Anchor" }
]
keywords = [
    "vera-anchor",
    "verification",
    "digital-evidence",
    "hedera",
    "hcs",
    "provenance",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Typing :: Typed",
]

[project.urls]
Homepage = "https://github.com/VeraAnchor/vera-anchor-verifier-py"
Repository = "https://github.com/VeraAnchor/vera-anchor-verifier-py"
Issues = "https://github.com/VeraAnchor/vera-anchor-verifier-py/issues"

[project.scripts]
vera-anchor = "vera_anchor_verifier.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/vera_anchor_verifier"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = [
    "live: tests requiring live public network services",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = [
    "E",
    "F",
    "I",
    "UP",
    "B",
    "SIM",
]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
show_error_codes = true
packages = ["vera_anchor_verifier"]
mypy_path = "src"